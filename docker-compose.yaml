version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: libmate_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-libmate_DB}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - libmate_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Flask Backend
  backend:
    build: ./backend
    container_name: libmate_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-libmate_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FLASK_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/app/uploads
    networks:
      - libmate_network
    command: >
      sh -c "python -c 'from app import create_app; create_app()' &
             gunicorn --bind 0.0.0.0:5000 --workers 4 'app:create_app()'"

  # React Frontend
  frontend:
    build: ./website_frontend
    container_name: libmate_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - libmate_network

volumes:
  mysql_data:
  uploads_data:

networks:
  libmate_network:
    driver: bridge